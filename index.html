<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier d'Entraînement : Matières &amp; Active Recall</title>
  <meta name="description" content="Plateforme interactive d'entraînement par matières et sous-sections : quiz active recall, flashcards, fiches repères, analyse grammaticale et dictées.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>§</text></svg>">
  <link rel="preload" href="assets/fonts/bricolage-grotesque-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand" aria-label="Accueil de la plateforme">
        <span class="brand-icon" aria-hidden="true">§</span>
        <span class="brand-text">
          <h1>Atelier d'Entraînement</h1>
          <p>Révision par matières et sous-sections</p>
        </span>
      </a>

      <div class="header-stats">
        <div id="stat-streak-chip" class="stat-chip streak" title="Série de bonnes réponses consécutives">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.66 11.2C17.43 10.9 17.15 10.64 16.89 10.38C16.22 9.78 15.46 9.35 14.82 8.72C13.33 7.26 13 4.85 13.95 3C13 3.23 12.17 3.75 11.46 4.32C8.87 6.4 7.85 10.07 9.07 13.22C9.11 13.32 9.15 13.42 9.15 13.55C9.15 13.77 9 13.97 8.8 14.05C8.57 14.15 8.33 14.09 8.14 13.93C8.08 13.88 8.04 13.83 8 13.76C6.87 12.33 6.69 10.28 7.45 8.64C5.78 10 4.87 12.3 5.03 14.47C5.21 16.78 6.64 18.89 8.77 19.85C11.08 20.9 13.91 20.62 15.93 19.14C18.14 17.5 19.09 14.61 18.31 11.96C18.15 11.66 17.93 11.41 17.66 11.2Z"/></svg>
          <span>Série <strong id="stat-streak">0</strong></span>
        </div>
        <div class="stat-chip" title="Score total accumulé">
          <span id="stat-score-total">0 XP</span>
        </div>
        <button type="button" id="reset-all-stats" class="btn-secondary btn-compact" title="Remettre les compteurs à zéro">
          Réinitialiser
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section class="catalog-hero">
      <h2>Choisissez votre matière</h2>
      <p>
        Sélectionnez une discipline puis accédez à ses sous-sections (chapitres, quiz en rappel actif, flashcards et fiches repères).
      </p>
    </section>

    <section class="catalog-controls" aria-label="Filtrer les matières">
      <div id="catalog-filters" class="domain-pills"></div>
      <div class="catalog-search-row">
        <div class="search-bar-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="catalog-search" class="search-input" aria-label="Rechercher une matière ou une sous-section" placeholder="Rechercher une matière ou un chapitre...">
        </div>
        <span id="catalog-count" class="mono-counter"></span>
      </div>
    </section>

    <section id="subjects-grid" class="subjects-grid" aria-label="Liste des matières disponibles">
      <!-- Rendu dynamique par js/ui/catalog-page.js -->
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>made by @perazaf1 2026</p>
    </div>
  </footer>

  <script src="js/core/catalog.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/ui/header.js"></script>
  <script src="js/ui/catalog-page.js"></script>
</body>
</html>
